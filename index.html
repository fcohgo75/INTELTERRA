<script>
(function(){
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xe9ecef,2400,5000);
const camera=new THREE.PerspectiveCamera(38,1,1,6000);
camera.position.set(0,0,580);
scene.add(new THREE.AmbientLight(0xffffff,0.62));
const d1=new THREE.DirectionalLight(0xffffff,0.8);d1.position.set(200,220,300);scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.3);d2.position.set(-250,-100,200);scene.add(d2);
const d3=new THREE.DirectionalLight(0xffffff,0.28);d3.position.set(0,-50,-300);scene.add(d3);
function hex(c){return new THREE.Color(c);}
const DEG=Math.PI/180, HALF=13;

/* ================= CIUDAD 3D DE FONDO (estilo mapa) ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(11);
const cityGroup=new THREE.Group();
const cityPan=new THREE.Group();
cityGroup.add(cityPan);
cityGroup.rotation.x=1.05;                  // vista aerea: el mapa de cara al espectador
cityGroup.position.set(0,-115,-470);
scene.add(cityGroup);
(function buildCity(){
  /* BASEMAP cartografico en grises claros (estilo GIS):
     red vial con jerarquia y casing, manzanas irregulares, rio,
     parques, bulevar diagonal, graticule y edificacion discreta */
  const WORLD=12000, PX=4096, S=PX/WORLD;
  function toPx(w){return (w+WORLD/2)*S;}
  const cv=document.createElement('canvas');cv.width=cv.height=PX;
  const g=cv.getContext('2d');
  // suelo
  g.fillStyle='#e9ecef';g.fillRect(0,0,PX,PX);
  // graticule GIS muy sutil
  g.strokeStyle='rgba(182,188,196,0.35)';g.lineWidth=0.7;
  for(let w=-6000;w<=6000;w+=1000){
    g.beginPath();g.moveTo(toPx(w),0);g.lineTo(toPx(w),PX);g.stroke();
    g.beginPath();g.moveTo(0,toPx(w));g.lineTo(PX,toPx(w));g.stroke();
  }
  // trama vial irregular
  const xs=[-6000],zs=[-6000];
  while(xs[xs.length-1]<6000)xs.push(xs[xs.length-1]+125+rng()*115);
  while(zs[zs.length-1]<6000)zs.push(zs[zs.length-1]+125+rng()*115);
  const avX={},avZ={};
  for(let i=4;i<xs.length-1;i+=6+Math.floor(rng()*3))avX[i]=1;
  for(let j=4;j<zs.length-1;j+=6+Math.floor(rng()*3))avZ[j]=1;
  // manzanas: relleno apenas mas oscuro + contorno de lote
  const tints=['#e3e6ea','#e6e9ec','#e1e4e8'];
  const parks={};
  for(let k=0;k<16;k++)parks[(1+Math.floor(rng()*(xs.length-3)))+','+(1+Math.floor(rng()*(zs.length-3)))]=1;
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<zs.length-1;j++){
    const x0=toPx(xs[i]),z0=toPx(zs[j]),x1=toPx(xs[i+1]),z1=toPx(zs[j+1]);
    g.fillStyle=parks[i+','+j]?'#e2e5e9':tints[Math.floor(rng()*tints.length)];
    g.fillRect(x0,z0,x1-x0,z1-z0);
    g.strokeStyle='rgba(198,204,211,0.4)';g.lineWidth=0.4;
    g.strokeRect(x0+0.8,z0+0.8,x1-x0-1.6,z1-z0-1.6);
  }
  // rio (banda curva gris azulada muy palida) con ribera verde-gris
  function riverPt(t){
    const x=-6000+12000*t;
    const z=-2200+4200*t*t+1400*Math.sin(t*4.2);
    return {x:x,z:z};
  }
  function drawPath(widthW,style){
    g.strokeStyle=style;g.lineWidth=widthW*S;g.lineCap='round';
    g.beginPath();
    for(let k=0;k<=60;k++){
      const p=riverPt(k/60);
      k?g.lineTo(toPx(p.x),toPx(p.z)):g.moveTo(toPx(p.x),toPx(p.z));
    }
    g.stroke();
  }
  drawPath(280,'#e1e4e8');       // ribera
  drawPath(140,'#d4dade');       // agua
  // calles: casing gris + relleno blanco (lenguaje cartografico)
  function road(x0,z0,x1,z1,wW){
    g.lineCap='round';
    g.strokeStyle='#c9cdd3';g.lineWidth=Math.max(1.6,(wW+3)*S);
    g.beginPath();g.moveTo(toPx(x0),toPx(z0));g.lineTo(toPx(x1),toPx(z1));g.stroke();
    g.strokeStyle='#ffffff';g.lineWidth=Math.max(1.1,wW*S);
    g.beginPath();g.moveTo(toPx(x0),toPx(z0));g.lineTo(toPx(x1),toPx(z1));g.stroke();
  }
  xs.forEach(function(x,i){road(x,-6000,x,6000,avX[i]?42:16);});
  zs.forEach(function(z,j){road(-6000,z,6000,z,avZ[j]?42:16);});
  road(-6000,3400,6000,-4200,55);          // bulevar diagonal
  // linea central discontinua en avenidas
  g.strokeStyle='#e4e7ea';g.lineWidth=0.8;g.setLineDash([5,8]);
  xs.forEach(function(x,i){if(avX[i]){g.beginPath();g.moveTo(toPx(x),0);g.lineTo(toPx(x),PX);g.stroke();}});
  zs.forEach(function(z,j){if(avZ[j]){g.beginPath();g.moveTo(0,toPx(z));g.lineTo(PX,toPx(z));g.stroke();}});
  g.beginPath();g.moveTo(toPx(-6000),toPx(3400));g.lineTo(toPx(6000),toPx(-4200));g.stroke();
  g.setLineDash([]);
  // arboleda punteada en parques y ribera
  g.fillStyle='rgba(178,184,191,0.5)';
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<zs.length-1;j++){
    if(!parks[i+','+j])continue;
    for(let k=0;k<18;k++){
      const px=toPx(xs[i]+40+rng()*(xs[i+1]-xs[i]-80));
      const pz=toPx(zs[j]+40+rng()*(zs[j+1]-zs[j]-80));
      g.beginPath();g.arc(px,pz,2.2+rng()*2.2,0,6.3);g.fill();
    }
  }
  for(let k=0;k<160;k++){
    const p=riverPt(rng());
    const off=(rng()-0.5)*240;
    g.beginPath();g.arc(toPx(p.x+off*0.2),toPx(p.z+off),2.0+rng()*2.0,0,6.3);g.fill();
  }
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  // material SIN luces: el mapa conserva su contraste exacto
  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(WORLD,WORLD),
    new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide})
  );
  ground.rotation.x=-Math.PI/2;
  cityPan.add(ground);
  /* edificacion discreta: acompana al mapa, no lo tapa */
  function nearRiver(x,z){
    let dm=1e9;
    for(let k=0;k<=24;k++){
      const p=riverPt(k/24);
      dm=Math.min(dm,Math.hypot(p.x-x,p.z-z));
    }
    return dm<230;
  }
  const items=[],trees=[];
  /* ciudad organica por PARCELAS: cada manzana se subdivide recursivamente
     con cortes aleatorios (catastro irregular) — cero patrones repetidos */
  function hash(a,b){const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x);}
  const CBD={x:1500,z:-1150,r:1050};
  const SUB={x:-2700,z:1750,r:620};
  function put(px,pz,w,d,h){if(items.length<24000)items.push({px:px,pz:pz,w:w,d:d,h:h});}
  function parcelar(x,z,w,d,depth,leaf){
    if(depth<=0||w<34||d<34){leaf(x,z,w,d);return;}
    const ratio=0.32+rng()*0.36;
    const horizontal=w/d>1.25?true:(d/w>1.25?false:rng()<0.5);
    const gap=3+rng()*5;
    if(horizontal){
      const w1=w*ratio;
      parcelar(x,z,w1-gap/2,d,depth-1,leaf);
      parcelar(x+w1+gap/2,z,w-w1-gap/2,d,depth-1,leaf);
    }else{
      const d1=d*ratio;
      parcelar(x,z,w,d1-gap/2,depth-1,leaf);
      parcelar(x,z+d1+gap/2,w,d-d1-gap/2,depth-1,leaf);
    }
  }
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<zs.length-1;j++){
    const cw=xs[i+1]-xs[i],cd=zs[j+1]-zs[j];
    const x0=xs[i],z0=zs[j],cxm=x0+cw/2,czm=z0+cd/2;
    if(parks[i+','+j]){
      const nt=6+Math.floor(rng()*6);
      for(let k=0;k<nt;k++)trees.push({px:x0+30+rng()*(cw-60),pz:z0+30+rng()*(cd-60),s:6+rng()*7});
      continue;
    }
    if(nearRiver(cxm,czm)){
      if(rng()<0.55)trees.push({px:cxm+(rng()-0.5)*cw*0.5,pz:czm+(rng()-0.5)*cd*0.5,s:5+rng()*6});
      continue;
    }
    const fC=Math.max(0,1-Math.hypot(cxm-CBD.x,czm-CBD.z)/CBD.r);
    const fS=Math.max(0,1-Math.hypot(cxm-SUB.x,czm-SUB.z)/SUB.r);
    const f=Math.max(fC,fS*0.55);
    /* zona difusa: dos escalas de ruido + azar puro — bordes de barrio mezclados */
    const zone=0.4*hash(Math.floor(i/3)*7,Math.floor(j/3)*13)+0.32*hash(i*17,j*29)+0.28*rng();
    if(rng()<0.05)continue;                    // baldio
    let depth,hMin,hVar;
    if(f>0.22){depth=1+(f>0.5?1:0);hMin=70+f*f*220;hVar=140+f*180;}
    else if(zone<0.35){depth=3;hMin=8;hVar=16;}
    else if(zone<0.62){depth=2+(rng()<0.5?1:0);hMin=13;hVar=34;}
    else if(zone<0.86){depth=2;hMin=26;hVar=58;}
    else{depth=1+(rng()<0.5?1:0);hMin=48;hVar=95;}
    const inset=12+rng()*8;
    parcelar(x0+inset,z0+inset,cw-inset*2,cd-inset*2,depth,function(px,pz,pw,pd){
      if(rng()<0.14){                          // parcela vacia: patio o lote
        if(rng()<0.4)trees.push({px:px+pw/2,pz:pz+pd/2,s:4.5+rng()*4});
        return;
      }
      const fw=pw*(0.58+rng()*0.3),fd=pd*(0.58+rng()*0.3);
      const ox=px+fw/2+rng()*(pw-fw),oz=pz+fd/2+rng()*(pd-fd);
      let h=(hMin+Math.pow(rng(),1.25)*hVar)*(0.7+rng()*0.65);
      if(rng()<0.035)h*=2+rng();               // rascacielos fuera de lugar / hito
      put(ox,oz,fw,fd,h);
      if(rng()<0.12&&fw>40&&fd>40)put(ox+(rng()-0.5)*fw*0.3,oz+(rng()-0.5)*fd*0.3,fw*0.5,fd*0.5,h*(1.3+rng()*0.5)); // torre sobre podio
    });
    if(f>0.55&&hash(i*3,j*5)<0.12)put(cxm,czm,55+rng()*30,55+rng()*30,380+rng()*130); // hito CBD
    if(rng()<0.4)trees.push({px:x0+20+rng()*(cw-40),pz:z0+20+rng()*(cd-40),s:4.5+rng()*4.5});
  }
  /* limpieza: quitar unicamente lo que invade avenidas, bulevar o rio
     (filtrado posterior — la ciudad generada es identica) */
  function distDiag(x,z){
    const ax=-6000,az=3400,bx=6000,bz=-4200;
    return Math.abs((bx-ax)*(az-z)-(ax-x)*(bz-az))/Math.hypot(bx-ax,bz-az);
  }
  function distRiver(x,z){
    let dm=1e9;
    for(let k=0;k<=28;k++){
      const p=riverPt(k/28);
      dm=Math.min(dm,Math.hypot(p.x-x,p.z-z));
    }
    return dm;
  }
  function invadeVia(px,pz,half){
    if(distDiag(px,pz)<38+half)return true;
    if(distRiver(px,pz)<92+half)return true;
    for(let q=0;q<xs.length;q++)if(avX[q]&&Math.abs(px-xs[q])<25+half)return true;
    for(let q=0;q<zs.length;q++)if(avZ[q]&&Math.abs(pz-zs[q])<25+half)return true;
    return false;
  }
  const itemsOk=items.filter(function(it){return !invadeVia(it.px,it.pz,Math.max(it.w,it.d)/2);});
  const treesOk=trees.filter(function(tr){return !invadeVia(tr.px,tr.pz,tr.s);});
  const box=new THREE.BoxGeometry(1,1,1);
  const bmat=new THREE.MeshPhongMaterial({color:0xffffff,flatShading:true,shininess:6,specular:0x8d939b});
  const inst=new THREE.InstancedMesh(box,bmat,itemsOk.length);
  const M=new THREE.Matrix4(),Sv=new THREE.Vector3(),P=new THREE.Vector3(),Q=new THREE.Quaternion(),C=new THREE.Color();
  const grays=[0xeef0f3,0xe9ecef,0xf2f3f6,0xe5e8ec];
  itemsOk.forEach(function(it,i){
    P.set(it.px,it.h/2,it.pz);Sv.set(it.w,it.h,it.d);
    M.compose(P,Q,Sv);
    inst.setMatrixAt(i,M);
    if(inst.setColorAt)inst.setColorAt(i,C.setHex(grays[Math.floor(rng()*grays.length)]));
  });
  if(inst.instanceColor)inst.instanceColor.needsUpdate=true;
  cityPan.add(inst);
  const tgeo=new THREE.IcosahedronGeometry(1,0);
  const tmat=new THREE.MeshPhongMaterial({color:0xd2d6db,flatShading:true,shininess:4});
  const tinst=new THREE.InstancedMesh(tgeo,tmat,treesOk.length);
  treesOk.forEach(function(tr,i){
    P.set(tr.px,tr.s*0.9,tr.pz);Sv.set(tr.s,tr.s,tr.s);
    M.compose(P,Q,Sv);
    tinst.setMatrixAt(i,M);
  });
  cityPan.add(tinst);
})();

function outlinePts(shape,div){
  let pts=shape.getPoints(div).map(function(p){return {x:p.x,y:p.y};});
  if(pts.length>1){
    const a=pts[0],b=pts[pts.length-1];
    if(Math.hypot(a.x-b.x,a.y-b.y)<1e-3)pts.pop();
  }
  let area=0;
  for(let i=0;i<pts.length;i++){
    const p=pts[i],q=pts[(i+1)%pts.length];
    area+=p.x*q.y-q.x*p.y;
  }
  if(area<0)pts.reverse();
  return pts;
}
function centroidOf(pts){let x=0,y=0;pts.forEach(function(p){x+=p.x;y+=p.y;});return {x:x/pts.length,y:y/pts.length};}
function startAtLeft(pts){
  const c=centroidOf(pts);let best=0,bd=1e9;
  pts.forEach(function(p,i){
    const a=Math.atan2(p.y-c.y,p.x-c.x);
    let d=Math.abs(a-Math.PI);d=Math.min(d,2*Math.PI-d);
    if(d<bd){bd=d;best=i;}
  });
  return pts.slice(best).concat(pts.slice(0,best));
}
function resample(pts,N){
  const L=[0];
  for(let i=1;i<=pts.length;i++){
    const a=pts[i-1],b=pts[i%pts.length];
    L.push(L[i-1]+Math.hypot(b.x-a.x,b.y-a.y));
  }
  const total=L[pts.length],out=[];let j=0;
  for(let k=0;k<N;k++){
    const d=total*k/N;
    while(j<pts.length-1&&L[j+1]<d)j++;
    const a=pts[j],b=pts[(j+1)%pts.length];
    const f=(d-L[j])/Math.max(L[j+1]-L[j],1e-9);
    out.push({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f});
  }
  return out;
}
const N=72;
function prepOutline(shape){return resample(startAtLeft(outlinePts(shape,26)),N);}
function gradColorAt(grad,x,y){
  const m=grad.m;
  const g0={x:m[0]*grad.x1+m[4],y:-(m[1]*grad.x1+m[5])};
  const g1={x:m[0]*grad.x2+m[4],y:-(m[1]*grad.x2+m[5])};
  const dx=g1.x-g0.x,dy=g1.y-g0.y;
  let t=((x-g0.x)*dx+(y-g0.y)*dy)/(dx*dx+dy*dy);
  t=Math.max(0,Math.min(1,t));
  const stops=grad.stops;
  for(let j=0;j<stops.length-1;j++){
    if(t<=stops[j+1][0]){
      const a=stops[j],b=stops[j+1];
      const f=(t-a[0])/Math.max(b[0]-a[0],1e-6);
      return hex(a[1]).lerp(hex(b[1]),Math.max(0,Math.min(1,f)));
    }
  }
  return hex(stops[stops.length-1][1]);
}
function pillOutline(len,w){
  const r=w/2,hl=len/2-r,s=new THREE.Shape();
  s.absarc(-hl,0,r,Math.PI/2,Math.PI*1.5,false);
  s.absarc(hl,0,r,-Math.PI/2,Math.PI/2,false);
  s.closePath();return prepOutline(s);
}
function chipOutline(r){
  const s=new THREE.Shape();s.absarc(0,0,r,0,Math.PI*2,false);
  return prepOutline(s);
}
/* malla morfable: los vértices viajan de cápsula a trazo con una ONDA
   que recorre la silueta desde la punta redonda hasta el extremo — la
   forma fluye, no cambia de golpe */
function buildMorphMesh(playOutline,finalOutlineWorld,angle,grad,solidColor){
  const fc=centroidOf(finalOutlineWorld);
  const ca=Math.cos(-angle),sa=Math.sin(-angle);
  const finalLocal=finalOutlineWorld.map(function(p){
    const x=p.x-fc.x,y=p.y-fc.y;
    return {x:x*ca-y*sa,y:x*sa+y*ca};
  });
  const tri=THREE.ShapeUtils.triangulateShape(finalLocal.map(function(p){return new THREE.Vector2(p.x,p.y);}),[]);
  const V=2*N;
  const pos=new Float32Array(V*3),col=new Float32Array(V*3);
  for(let i=0;i<N;i++){
    const a=playOutline[i];
    pos[i*3]=a.x;pos[i*3+1]=a.y;pos[i*3+2]=HALF;
    pos[(N+i)*3]=a.x;pos[(N+i)*3+1]=a.y;pos[(N+i)*3+2]=-HALF;
    const c=grad?gradColorAt(grad,finalOutlineWorld[i].x,finalOutlineWorld[i].y):hex(solidColor);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    col[(N+i)*3]=c.r;col[(N+i)*3+1]=c.g;col[(N+i)*3+2]=c.b;
  }
  const idx=[];
  tri.forEach(function(t){idx.push(t[0],t[1],t[2]);});
  tri.forEach(function(t){idx.push(N+t[2],N+t[1],N+t[0]);});
  for(let i=0;i<N;i++){
    const j=(i+1)%N;
    idx.push(i,N+i,N+j);idx.push(i,N+j,j);
  }
  const geo=new THREE.BufferGeometry();
  const attr=new THREE.BufferAttribute(pos,3);
  attr.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position',attr);
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setIndex(idx);
  const mat=new THREE.MeshPhongMaterial({vertexColors:true,shininess:55,specular:0x2a2a2a,flatShading:true});
  const mesh=new THREE.Mesh(geo,mat);
  return {mesh:mesh,play:playOutline,fin:finalLocal,attr:attr,
          slot:new THREE.Vector3(fc.x-cx,fc.y-cy,0)};
}

const actorCfg=[
 {play:function(){return pillOutline(215,42);},side:-1,delay:0.00,angle:-20*DEG,A:205,B:112,w1:1.5,w2:2.1,w3:1.1,ph:0.3,tx:1.4,ty:2.0,tz:1.2},
 {play:function(){return pillOutline(150,42);},side:1,delay:0.18,angle:-19.6*DEG,A:180,B:96,w1:-1.7,w2:1.8,w3:0.9,ph:2.4,tx:-1.8,ty:1.5,tz:-1.4},
 {play:function(){return pillOutline(150,42);},side:-1,delay:0.36,angle:19.4*DEG,A:172,B:122,w1:1.9,w2:1.5,w3:1.3,ph:4.2,tx:1.2,ty:-2.2,tz:1.6},
 {play:function(){return pillOutline(215,42);},side:1,delay:0.54,angle:20*DEG,A:212,B:100,w1:-1.4,w2:2.3,w3:0.8,ph:5.1,tx:-1.5,ty:-1.7,tz:-1.1},
 {play:function(){return chipOutline(34);},side:-1,delay:0.72,angle:0,A:150,B:140,w1:2.4,w2:2.7,w3:1.6,ph:1.2,tx:2.6,ty:-2.9,tz:2.1},
 {play:function(){return chipOutline(28);},side:1,delay:0.84,angle:0,A:160,B:130,w1:-2.2,w2:2.5,w3:1.8,ph:3.6,tx:-2.8,ty:2.4,tz:-2.3},
 {play:function(){return chipOutline(28);},side:1,delay:0.96,angle:0,A:145,B:150,w1:2.0,w2:-2.6,w3:1.4,ph:5.5,tx:2.2,ty:2.7,tz:-1.9}
];
const startY=[95,45,-45,-95,10,140,-140];
const group=new THREE.Group();
scene.add(group);
const actors=defs.map(function(def,i){
  const c=actorCfg[i];
  const sh=new THREE.Shape();def.build(sh);
  const b=buildMorphMesh(c.play(),prepOutline(sh),c.angle,def.grad||null,def.color||null);
  b.mesh.scale.setScalar(0.001);
  group.add(b.mesh);
  return {
    mesh:b.mesh,slot:b.slot,cfg:c,play:b.play,fin:b.fin,attr:b.attr,lastM:-1,
    start:new THREE.Vector3(950*c.side,startY[i],(i%2?70:-70)),
    playCenter:new THREE.Vector3(b.slot.x*0.35,b.slot.y*0.35,0)
  };
});
/* piezas finales BISELADAS (acabado pulido, como la vista previa):
   relevan a las mallas de morfosis al terminar la transformacion */
const polished=defs.map(function(def){
  const sh=new THREE.Shape();def.build(sh);
  const geo=new THREE.ExtrudeGeometry(sh,{depth:26,bevelEnabled:true,bevelThickness:1.4,bevelSize:1.4,bevelSegments:3,curveSegments:28});
  if(def.grad){
    const pos=geo.attributes.position,colors=new Float32Array(pos.count*3);
    for(let i=0;i<pos.count;i++){
      const c=gradColorAt(def.grad,pos.getX(i),pos.getY(i));
      colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
    }
    geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  }
  geo.computeBoundingBox();
  const bc=new THREE.Vector3();geo.boundingBox.getCenter(bc);
  geo.translate(-bc.x,-bc.y,-bc.z);
  const mat=def.grad
    ?new THREE.MeshPhongMaterial({vertexColors:true,shininess:55,specular:0x2a2a2a})
    :new THREE.MeshPhongMaterial({color:hex(def.color),shininess:55,specular:0x2a2a2a});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(bc.x-cx,bc.y-cy,0);
  mesh.visible=false;
  group.add(mesh);
  return mesh;
});
function applyMorph(a,M){
  if(M===a.lastM)return;
  a.lastM=M;
  const arr=a.attr.array,lam=0.55;
  for(let i=0;i<N;i++){
    const phase=0.5-0.5*Math.cos(2*Math.PI*i/N);   // 0 en la punta redonda, 1 en el extremo
    let s=(M*(1+lam)-lam*phase);
    s=Math.max(0,Math.min(1,s));
    s=s*s*(3-2*s);                                  // suavizado
    const p=a.play[i],f=a.fin[i];
    const x=p.x+(f.x-p.x)*s,y=p.y+(f.y-p.y)*s;
    arr[i*3]=x;arr[i*3+1]=y;
    arr[(N+i)*3]=x;arr[(N+i)*3+1]=y;
  }
  a.attr.needsUpdate=true;
}

/* ---- línea de tiempo ----
   0.0–1.6  entran GRANDES (a escala de la ciudad) cápsulas y fichas
   1.6–4.8  juegan mientras todo se va reduciendo hacia el centro
   4.6–6.1  vuelan a su lugar y la ONDA de metamorfosis los esculpe en vuelo
   6.1–6.5  aparece Intelterra · powered by Välstånd Vida
   6.6+     giro continuo                                                  */
const T_ENTRY=1.6,T_GO=4.8,T_ARRIVE=6.1,T_SPIN=6.7;
function clamp01(x){return Math.max(0,Math.min(1,x));}
function easeOutCubic(x){return 1-Math.pow(1-x,3);}
function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function easeInOutQuint(x){return x<0.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2;}
function wrapNear(a,t){return t+(a-t)-Math.round((a-t)/(2*Math.PI))*2*Math.PI;}
const tmpA=new THREE.Vector3(),tmpB=new THREE.Vector3();
function playPos(a,t,out){
  const c=a.cfg;
  out.set(
    a.playCenter.x+Math.sin(c.w1*t+c.ph)*c.A,
    a.playCenter.y+Math.sin(c.w2*t+c.ph*1.7)*c.B,
    Math.sin(c.w3*t+c.ph)*62
  );
  return out;
}

/* ---- encuadre responsivo: logo + textos siempre completos ---- */
let fitS=1,unitsPerPx=1;
const brand=document.getElementById('brand'),
      title=document.getElementById('title'),
      powered=document.getElementById('powered');
function fit(){
  const w=stage.clientWidth,h=stage.clientHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
  const visH=2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  unitsPerPx=visH/h;
  const LH=Math.min(h*0.46,w*0.72);            // alto del logo en px
  fitS=(LH*unitsPerPx)/285;
  const intelPx=Math.max(16,Math.min(44,LH*0.16));
  title.style.fontSize=intelPx+'px';
  powered.style.fontSize=(intelPx*0.3)+'px';
  // "powered by..." debe ocupar poco más de la mitad del ancho de Intelterra
  const Wt=title.offsetWidth,Wp=powered.offsetWidth;
  if(Wp>0)powered.style.fontSize=(intelPx*0.3*(0.56*Wt/Wp))+'px';
  const gap1=LH*0.08;
  const blockExtra=gap1+title.offsetHeight+powered.offsetHeight+intelPx*0.35;
  group.position.y=(blockExtra/2)*unitsPerPx;   // sube el logo para centrar el conjunto
  const logoBottomPx=h/2-blockExtra/2+LH/2;
  brand.style.top=(logoBottomPx+gap1)+'px';
}
fit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

let t0=performance.now(),dragging=false,lastX=0,lastY=0,tiltX=0;
document.getElementById('replay').addEventListener('click',function(){
  t0=performance.now();
  group.rotation.set(0,0,0);tiltX=0;
  brand.classList.remove('show');
});
const el=renderer.domElement;
el.addEventListener('pointerdown',function(e){dragging=true;lastX=e.clientX;lastY=e.clientY;stage.style.cursor='grabbing';el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',function(e){
  if(!dragging)return;
  group.rotation.y+=(e.clientX-lastX)*0.01;
  tiltX=Math.max(-0.8,Math.min(0.8,tiltX+(e.clientY-lastY)*0.008));
  lastX=e.clientX;lastY=e.clientY;
});
el.addEventListener('pointerup',function(){dragging=false;stage.style.cursor='grab';});

let lastT=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=(now-lastT)/1000;lastT=now;
  const t=(now-t0)/1000;
  // entran a escala de la ciudad y todo se reduce hasta encuadrar el logo
  const zoom=1+1.6*(1-easeInOutCubic(clamp01((t-0.4)/(T_ARRIVE-0.6))));
  group.scale.setScalar(fitS*zoom);
  actors.forEach(function(a,i){
    const c=a.cfg;
    const eIn=easeOutCubic(clamp01((t-c.delay)/T_ENTRY));
    const go=easeInOutQuint(clamp01((t-T_GO)/(T_ARRIVE-T_GO)));
    const M=easeInOutCubic(clamp01((t-(T_GO+0.2)-i*0.09)/1.15));
    playPos(a,Math.min(t,T_GO),tmpA);
    tmpB.lerpVectors(a.start,tmpA,eIn);
    a.mesh.position.lerpVectors(tmpB,a.slot,go);
    const u=Math.min(t,T_GO);
    const rx=wrapNear(c.tx*u*eIn,0),ry=wrapNear(c.ty*u*eIn,0),rz=wrapNear(c.tz*u*eIn,c.angle);
    a.mesh.rotation.set(rx*(1-go),ry*(1-go),c.angle*go+rz*(1-go));
    applyMorph(a,M);
    // relevo imperceptible a la pieza biselada al quedar armada
    if(M>=1&&go>=1){
      if(a.mesh.visible){a.mesh.visible=false;polished[i].visible=true;}
    }else if(!a.mesh.visible){a.mesh.visible=true;polished[i].visible=false;}
    a.mesh.scale.setScalar(Math.max(0.001,eIn));
  });
  if(t>=T_ARRIVE+0.15&&!brand.classList.contains('show'))brand.classList.add('show');
  if(t>=T_SPIN){
    const ramp=clamp01((t-T_SPIN)/0.9);
    if(!dragging)group.rotation.y+=dt*1.1*ramp;
  }
  group.rotation.x+=(tiltX-group.rotation.x)*0.12;
  // el fondo permanece estatico
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
window.addEventListener('resize',fit);
})();
</script>
